<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Calculator</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: hsl(0,0%,95%);
            background-image: image('wien-background.jpg');
        }
        #Calculator {
            font-family: Arial, sans-serif;
            background-color: hsl(0,0%,15%);
            border-radius: 15px;
            max-width: 500px;
            overflow: hidden;
        }
        #display {
            width: 100%;
            height: 100px;
            font-size: 5rem;
            text-align: left;
            padding: 20px;
            border: none;
            background-color: hsl(0,0%,20%);
            color: white;
        }
        #keys{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 25px;
        }
        button {
            width: 100px;
            height: 100px;
            border-radius: 50px;
            border: none;
            background-color: hsl(0,0%,30%);
            color: white;
            font-size: 3rem;
            font-weight: bold;
            cursor: pointer;
            
        }
        button:hover {
            background-color: hsl(0,0%,40%);
        }
        button:active {
            background-color: hsl(0,0%,50%);
            transform: scale(1.1);
        }
        .operator {
            background-color: hsl(39,100%,50%);
        }
        .operator:hover {
            background-color: hsl(39,100%,60%);
        }
        .operator:active {
            background-color: hsl(39,100%,70%);
        }
    </style>
</head>
<body>


    <div id="Calculator">

        <input id="display" readonly />

        
        <div id="keys">


            <button class="operator" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="deleteLastCharacter()">⌫</button>
            <button class="operator" onclick="percent()">%</button>
            <button class="operator" onclick="appendToDisplay('/')">/</button>


            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button class="operator" onclick="appendToDisplay('*')">*</button>


            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button class="operator" onclick="appendToDisplay('-')">-</button>



            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button class="operator" onclick="appendToDisplay('+')">+</button>
            <button class="operator" onclick="changenumber()">+/-</button>

            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('.')">.</button>

            <button class="operator" onclick="calculate()">=</button>

        </div>
    </div>

    <script>

        const display = document.getElementById('display');



        function appendToDisplay(input) {
            display.value += input;
        }

        function clearDisplay() {
            display.value = '';
        }

        function deleteLastCharacter() {
            display.value = display.value.slice(0, -1);
        }

        function changenumber() {
            if (display.value) {
                display.value = String(parseFloat(display.value) * -1);
            }
        }


        function percent() {
            if (display.value) {
                display.value = String(parseFloat(display.value) / 100);
            }
        }

        function calculate() {
            if (display.value === 'Error') {
                display.value = '';
            } else {
                try {
                    display.value = eval(display.value);
                }
                catch (error) {
                    display.value = 'Error';
                }
            }
            
            
        }

    </script>
</body>
</html>
