<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACK//CURRENCY</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --green: #00ff88;
            --dark-green: #00cc6a;
            --bg: #030806;
            --panel: #07110c;
            --border: #12452c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 35px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            color: var(--green);
            background: radial-gradient(ellipse at center, #0a2013 0%, #030806 75%);
            overflow-x: hidden;
        }

            /* Scanlines */
            body::before {
                content: "";
                position: fixed;
                inset: 0;
                pointer-events: none;
                z-index: 5;
                background: repeating-linear-gradient( to bottom, transparent 0px, transparent 3px, #00ff8808 4px );
            }

        .container {
            width: 100%;
            max-width: 470px;
            padding: 25px;
            position: relative;
            background: #06100b;
            border: 1px solid var(--green);
            border-radius: 5px;
            box-shadow: 0 0 10px #00ff8830, 0 0 35px #00ff8815, inset 0 0 25px #00ff8808;
        }

            .container::before {
                content: "SYSTEM_STATUS: ONLINE";
                display: block;
                font-size: 11px;
                color: #69a987;
                letter-spacing: 2px;
                border-bottom: 1px solid var(--border);
                padding-bottom: 12px;
            }

        h1 {
            font-size: clamp(23px, 6vw, 30px);
            text-align: center;
            text-shadow: 0 0 12px var(--green);
            margin: 25px 0 8px;
            animation: glow 2s infinite alternate;
        }

        p {
            text-align: center;
            color: #72a889;
            font-size: 13px;
        }

        .subtitle {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 13px;
            letter-spacing: 1px;
            color: var(--green);
        }

        input, select, button {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            font-family: inherit;
            font-size: 15px;
            color: var(--green);
            background: #020704;
            border: 1px solid var(--border);
            border-radius: 3px;
            outline: none;
        }

            input:focus, select:focus {
                border-color: var(--green);
                box-shadow: 0 0 10px #00ff8830;
            }

            select option {
                background: #06100b;
            }

        button {
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 1px;
            transition: 0.2s;
        }

            button:hover {
                color: #001b0d;
                background: var(--green);
                box-shadow: 0 0 15px #00ff8870;
            }

        #swap {
            margin: 18px 0 5px;
            border-style: dashed;
        }

        .result {
            margin-top: 25px;
            padding: 20px 12px;
            background: #00ff8808;
            border: 1px solid var(--border);
            text-align: center;
        }

            .result p {
                margin: 5px 0 12px;
            }

        #output {
            font-size: clamp(28px, 8vw, 36px);
            font-weight: bold;
            overflow-wrap: anywhere;
            text-shadow: 0 0 12px #00ff8870;
        }

        #equation {
            margin-top: 15px;
            color: #b2ffcf;
        }

        #convert {
            margin-top: 18px;
            background: var(--green);
            color: #001b0d;
            border: none;
            box-shadow: 0 0 12px #00ff8830;
        }

            #convert:hover {
                background: #a0ffcc;
                box-shadow: 0 0 20px #00ff8890;
            }

        .status {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 22px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            font-size: 10px;
            color: #5b9b75;
        }

        .online {
            color: var(--green);
        }

            .online::before {
                content: "● ";
                animation: blink 1s infinite;
            }

        .note {
            font-size: 10px;
            line-height: 1.7;
            margin-top: 18px;
        }

        .cursor {
            display: inline-block;
            animation: blink 0.8s steps(2) infinite;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 5px var(--green);
            }

            to {
                text-shadow: 0 0 18px var(--green);
            }
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <h1> &gt; HACK_CURRENCY<span class="cursor">_</span></h1>
        <p class="subtitle">// WÄHRUNGS-CONVERTER v2.0</p>

        <label for="amount">[ INPUT_AMOUNT ]</label>
        <input id="amount" type="number" value="1" min="0" step="any">

        <label for="from">[ SOURCE_CURRENCY ]</label>
        <select id="from">
            <option value="EUR">EUR // EURO</option>
            <option value="USD">USD // US DOLLAR</option>
            <option value="JPY">JPY // JAPAN YEN</option>
            <option value="GBP">GBP // BRITISH POUND</option>
            <option value="CHF">CHF // SWISS FRANC</option>
            <option value="CNY">CNY // CHINESE YUAN</option>
            <option value="INR">INR // INDIAN RUPEE</option>
            <option value="KRW">KRW // SOUTH KOREAN WON</option>
        </select>

        <button id="swap" type="button">
            [ ⇅ SWAP_CURRENCIES ]
        </button>

        <label for="to">[ TARGET_CURRENCY ]</label>
        <select id="to">
            <option value="JPY">JPY // JAPAN YEN</option>
            <option value="EUR">EUR // EURO</option>
            <option value="USD">USD // US DOLLAR</option>
            <option value="GBP">GBP // BRITISH POUND</option>
            <option value="CHF">CHF // SWISS FRANC</option>
            <option value="CNY">CNY // CHINESE YUAN</option>
            <option value="INR">INR // INDIAN RUPEE</option>
            <option value="KRW">KRW // SOUTH KOREAN WON</option>
        </select>

        <div class="result">
            <p>&gt;&gt; CONVERSION_RESULT</p>
            <div id="output">163 JPY</div>
            <p id="equation">1 EUR = 163 JPY</p>
        </div>

        <button id="convert" type="button">
            [ EXECUTE_CONVERSION ]
        </button>

        <div class="status">
            <span class="online">SYSTEM ONLINE</span>
            <span id="clock">00:00:00</span>
        </div>

        <p class="note">
            &gt; MODE: DEMO_EXCHANGE_RATES<br>
            &gt; STATUS: SIMULATION ONLY<br>
            &gt; LIVE MARKET DATA: NOT CONNECTED
        </p>
    </div>

    <script>
const rates = {
            EUR: 1,
            USD: 1.09,
            JPY: 163,
            GBP: 0.84,
            CHF: 0.95,
            CNY: 7.85,
            INR: 91,
            KRW: 1480
};

const amount = document.getElementById("amount");
const from = document.getElementById("from");
const to = document.getElementById("to");
const output = document.getElementById("output");
const equation = document.getElementById("equation");

function format(number) {
            return new Intl.NumberFormat("de-DE", {
                maximumFractionDigits: 2
            }).format(number);
}

function convert() {
            const value = Math.max(0, Number(amount.value) || 0);
            const result = value / rates[from.value] * rates[to.value];

            output.textContent = format(result) + " " + to.value;

            equation.textContent =
                "1 " + from.value + " = " +
                format(rates[to.value] / rates[from.value]) +
                " " + to.value;
}

document.getElementById("convert")
            .addEventListener("click", convert);

amount.addEventListener("input", convert);
from.addEventListener("change", convert);
to.addEventListener("change", convert);

document.getElementById("swap").addEventListener("click", () => {
            const oldFrom = from.value;
            from.value = to.value;
            to.value = oldFrom;
            convert();
});

function updateClock() {
            document.getElementById("clock").textContent =
                new Date().toLocaleTimeString("de-DE");
}

setInterval(updateClock, 1000);
updateClock();
convert();
    </script>
</body>
</html>
