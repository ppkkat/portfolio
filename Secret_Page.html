
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            color: #172033;
            display: flex;
            justify-content: center;
            padding: 40px 15px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 25px #0001;
            width: 100%;
            max-width: 450px;
        }

        h1 {
            text-align: center;
            color: #5146e5;
        }

        p {
            color: #687386;
            text-align: center;
        }

        input, select, button {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            background: #5146e5;
            color: white;
            border: none;
            cursor: pointer;
        }

            button:hover {
                background: #3930b5;
            }

        .result {
            background: #eeedff;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-top: 15px;
        }

        #output {
            font-size: 28px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .note {
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>💱 Währungsrechner</h1>
        <p>Rechne Euro in andere Währungen um!</p>

        <label for="amount">Betrag</label>
        <input id="amount" type="number" value="1" min="0" step="any">

        <label for="from">Von</label>
        <select id="from">
            <option value="EUR">Euro (EUR)</option>
            <option value="USD">US-Dollar (USD)</option>
            <option value="JPY">Japanischer Yen (JPY)</option>
            <option value="GBP">Britisches Pfund (GBP)</option>
            <option value="CHF">Schweizer Franken (CHF)</option>
            <option value="CNY">Chinesischer Yuan (CNY)</option>
            <option value="INR">Indische Rupie (INR)</option>
            <option value="KRW">Südkoreanischer Won (KRW)</option>
        </select>

        <button id="swap" type="button">⇅ Währungen tauschen</button>

        <label for="to">Nach</label>
        <select id="to">
            <option value="JPY">Japanischer Yen (JPY)</option>
            <option value="EUR">Euro (EUR)</option>
            <option value="USD">US-Dollar (USD)</option>
            <option value="GBP">Britisches Pfund (GBP)</option>
            <option value="CHF">Schweizer Franken (CHF)</option>
            <option value="CNY">Chinesischer Yuan (CNY)</option>
            <option value="INR">Indische Rupie (INR)</option>
            <option value="KRW">Südkoreanischer Won (KRW)</option>
        </select>

        <div class="result">
            <p>Du bekommst ungefähr:</p>
            <div id="output">163 JPY</div>
            <p id="equation">1 EUR = 163 JPY</p>
        </div>

        <button id="convert" type="button">Umrechnen</button>

        <p class="note">
            Hinweis: Dies sind Beispielkurse, keine Live-Wechselkurse.
        </p>
    </div>

    <script>
// Beispielkurse: Wert einer Währung pro 1 Euro
const rates = {
          EUR: 1,
          USD: 1.09,
          JPY: 163,
          GBP: 0.84,
          CHF: 0.95,
          CNY: 7.85,
          INR: 91,
          KRW: 1480
};

const amount = document.getElementById("amount");
const from = document.getElementById("from");
const to = document.getElementById("to");
const output = document.getElementById("output");
const equation = document.getElementById("equation");

function convert() {
          const value = Math.max(0, Number(amount.value) || 0);

          // Erst in Euro umrechnen, dann in die Zielwährung
          const result = value / rates[from.value] * rates[to.value];

          const format = number =>
            new Intl.NumberFormat("de-DE", {
              maximumFractionDigits: 2
            }).format(number);

          output.textContent =
            format(result) + " " + to.value;

          equation.textContent =
            "1 " + from.value + " = " +
            format(rates[to.value] / rates[from.value]) +
            " " + to.value;
}

document.getElementById("convert").addEventListener("click", convert);
amount.addEventListener("input", convert);
from.addEventListener("change", convert);
to.addEventListener("change", convert);

document.getElementById("swap").addEventListener("click", () => {
          const oldFrom = from.value;
          from.value = to.value;
          to.value = oldFrom;
          convert();
});

convert();
    </script>
</body>
</html>
