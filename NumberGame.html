<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Number Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        h1 {
            color: #333;
        }

        #homeBnt {
            padding: 10px 20px;
            font-size: 1.5em;
            color: white;
            background-color: hsl(214 100% 74%);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.25s;
        }

        #homeBnt:hover {
            background-color: hsl(214 100% 56%);
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>
    <h1>Number Game</h1>

    <button onclick="location.reload()">Restart</button>
    <button id="homeBnt" onclick="window.location.href='index.html'">
        Home
    </button>

    <script>
        // Number Game

        let min = 0;
        let max;
        let answer;
        let attempts = 0;
        let running = false;

        // Ask the player for the maximum number
        const input = window.prompt("Please enter the maximum number:");

        // Stop if the player cancels
        if (input === null) {
            window.alert("Game cancelled.");
        } else {
            max = Number(input);

            // Validate the maximum number
            if (
                input.trim() === "" ||
                !Number.isSafeInteger(max) ||
                max < 1
            ) {
                window.alert(
                    "Please enter a positive whole number."
                );
            } else {
                // Generate a random integer from 0 to max, inclusive
                answer = Math.floor(Math.random() * (max + 1));
                running = true;

                // Save the original maximum for the final message
                const originalMax = max;

                while (running) {
                    const inputGuess = window.prompt(
                        `Guess a number between ${min} - ${max}`
                    );

                    // Stop if the player cancels
                    if (inputGuess === null) {
                        window.alert("Game cancelled.");
                        running = false;
                        break;
                    }

                    // Validate the guess
                    if (
                        inputGuess.trim() === "" ||
                        !Number.isSafeInteger(Number(inputGuess))
                    ) {
                        window.alert("Please enter a valid whole number.");
                        continue;
                    }

                    const guess = Number(inputGuess);

                    if (guess < min || guess > max) {
                        window.alert(
                            `Please enter a number between ${min} and ${max}.`
                        );
                        continue;
                    }

                    attempts++;

                    if (guess < answer) {
                        window.alert("TOO LOW! TRY AGAIN!");
                        min = guess;
                    } else if (guess > answer) {
                        window.alert("TOO HIGH! TRY AGAIN!");
                        max = guess;
                    } else {
                        window.alert(
                            `CORRECT! The answer was ${answer}.\n` +
                            `It took you ${attempts} attempts.\n` +
                            `The original maximum was ${originalMax}.`
                        );

                        running = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
