<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Zeitform-Erkenner</title>
    <style>
        body {
            font-family: 'Comic Sans MS', Arial, sans-serif;
            background: linear-gradient(135deg, #8ec5fc, #e0c3fc);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #4a2c8c;
            text-shadow: 2px 2px 0px #ffffff;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        textarea {
            width: 100%;
            height: 120px;
            border-radius: 10px;
            border: 2px solid #b38bff;
            padding: 10px;
            font-size: 16px;
            resize: none;
            outline: none;
        }

            textarea:focus {
                border-color: #7a4cff;
                box-shadow: 0 0 10px #c7a3ff;
            }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background: #7a4cff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

            button:hover {
                background: #5b2fd6;
                transform: scale(1.03);
            }

        #result {
            margin-top: 20px;
            font-size: 20px;
            text-align: center;
            background: #f3e8ff;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #d3b3ff;
        }
    </style>
</head>
<body>
    <h1>Zeitform-Erkenner (Deutsch)</h1>
    <label for="inputText">Gib einen Satz ein:</label>
    <textarea id="inputText" placeholder="z.B. Ich habe gegessen."></textarea>
    <button onclick="detectTense()">Zeitform bestimmen</button>
    <button onclick="reset()">Reset</button>

    <div id="result"></div>

    <script>
    function detectTense() {
      const text = document.getElementById('inputText').value.toLowerCase();
      const resultEl = document.getElementById('result');

      if (!text.trim()) {
        resultEl.textContent = "Bitte gib einen Satz ein.";
        return;
      }

      let tense = "Unklar / nicht erkannt";

      // Sehr einfache Heuristiken:

      // Plusquamperfekt: hatte/war + Partizip II
      if ((text.includes("hatte ") || text.includes("war ")) &&
          (text.match(/\bge\w+en\b/) || text.match(/\bge\w+t\b/))) {
        tense = "Plusquamperfekt";
      }
      // Perfekt: habe/hat/hast/haben/sein/bist/ist + Partizip II
      else if ((text.includes("habe ") || text.includes("hat ") ||
                text.includes("hast ") || text.includes("haben ") ||
                text.includes("bin ") || text.includes("bist ") ||
                text.includes("ist ") || text.includes("seid ")) &&
               (text.match(/\bge\w+en\b/) || text.match(/\bge\w+t\b/))) {
        tense = "Perfekt";
      }
      // Futur I: werden + Infinitiv
      else if ((text.includes("werde ") || text.includes("wirst ") ||
                text.includes("wird ") || text.includes("werden ") ||
                text.includes("werdet ")) &&
               text.match(/\b\w+en\b/)) {
        tense = "Futur I";
      }
      // Futur II: werden + Partizip II + haben/sein
      else if ((text.includes("werde ") || text.includes("wirst ") ||
                text.includes("wird ") || text.includes("werden ") ||
                text.includes("werdet ")) &&
               (text.match(/\bge\w+en\b/) || text.match(/\bge\w+t\b/)) &&
               (text.includes("haben") || text.includes("sein"))) {
        tense = "Futur II";
      }
      // Präteritum: einfache Vergangenheitsformen (sehr grob)
      else if (text.match(/\bwar\b/) || text.match(/\bhatte\b/) ||
               text.match(/\bging\b/) || text.match(/\bsagte\b/) ||
               text.match(/\bspielte\b/) || text.match(/\bmachte\b/)) {
        tense = "Präteritum";
      }
      // Präsens: Standardform, wenn nichts anderes passt
      else {
        tense = "Präsens (oder nicht eindeutig)";
      }

      resultEl.textContent = "Erkannte Zeitform: " + tense;
    }

    function reset(){
    document.getElementById('inputText').value = '';
    document.getElementById('result').textContent = '';
}

    </script>
</body>
</html>
