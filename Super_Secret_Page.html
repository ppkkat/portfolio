<!DOCTYPE html>
<html lang="de" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Super Geheime Seite</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        h1 {
            text-align: center;
            color: #333;
        }

        #container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        #list {
            list-style-type: none;
            padding: 0;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #fff;
        }

            .item img {
                width: 200px;
                height: auto;
                display: block;
            }

            .item h3 {
                margin-top: 0;
            }
    </style>
</head>

<body>
    <div id="container">
        <h1>Meme-List</h1>

        <ul id="list">
            <li class="item">
                <a href="images/Egg_dog.png" target="_blank">
                    <img src="images/Egg_dog.png" alt="Geheime Bilddatei" />
                </a>

                <div class="steckbrief">
                    <h3>Steckbrief</h3>
                    <ol>
                        <li><input type="text" placeholder="Name" /></li>
                    </ol>

                    <button onclick="newInput(this)">New Input</button>
                    <button onclick="deleteItem(this)">Löschen</button>
                </div>
            </li>

            <li class="item">
                <a href="images/Tung_tung_tung_Sahur.png" target="_blank">
                    <img src="images/Tung_tung_tung_Sahur.png" alt="Geheime Bilddatei" />
                </a>

                <div class="steckbrief">
                    <h3>Steckbrief</h3>
                    <ol>
                        <li><input type="text" placeholder="Name" /></li>
                    </ol>

                    <button onclick="newInput(this)">New Input</button>
                    <button onclick="deleteItem(this)">Löschen</button>
                </div>
            </li>

            <li class="item">
                <a href="images/Cucci_Morty.png" target="_blank">
                    <img src="images/Cucci_Morty.png" alt="Geheime Bilddatei" />
                </a>

                <div class="steckbrief">
                    <h3>Steckbrief</h3>
                    <ol>
                        <li><input type="text" placeholder="Name" /></li>
                    </ol>

                    <button onclick="newInput(this)">New Input</button>
                    <button onclick="deleteItem(this)">Löschen</button>
                </div>
            </li>
        </ul>

        <button onclick="newItem()">Neuer Eintrag</button>
        <input type="file" id="imageUpload" accept="image/*" />
    </div>

    <script>
                // Wir holen uns die Liste aus dem HTML
                const list = document.getElementById("list");
                const imageUpload = document.getElementById("imageUpload");

                // Diese Funktion erstellt einen neuen Steckbrief
                function newItem() {
                    // Wir prüfen, ob ein Bild ausgewählt wurde
                    const file = imageUpload.files[0];

                    if (!file) {
                        alert("Bitte wähle ein Bild aus.");
                        return;
                    }

                    // Prüfen, ob es wirklich ein Bild ist
                    if (!file.type.startsWith("image/")) {
                        alert("Bitte wähle eine Bilddatei aus.");
                        return;
                    }

                    // Wir erstellen einen neuen Listeneintrag
                    const item = document.createElement("li");
                    item.className = "item";

                    // Wir fügen Bild und Namensfeld ein
                    item.innerHTML = `
                        <a href="" target="_blank">
                            <img src="" alt="Mein Bild">
                        </a>

                        <div class="steckbrief">
                            <h3>Steckbrief</h3>

                            <ol>
                                <li><input type="text" placeholder="Name" /></li>
                            </ol>

                            <button onclick="newInput(this)">New Input</button>
                            <button onclick="deleteItem(this)">Löschen</button>
                        </div>
                    `;

                    // Wir lesen die Bilddatei ein
                    const reader = new FileReader();

                    reader.onload = function(event) {
                        // Das Bild im neuen Steckbrief anzeigen
                        const image = item.querySelector("img");
                        const link = item.querySelector("a");

                        image.src = event.target.result;
                        link.href = event.target.result;
                    };

                    reader.readAsDataURL(file);

                    // Der neue Steckbrief kommt in die Liste
                    list.appendChild(item);

                    // Die Dateiauswahl zurücksetzen
                    imageUpload.value = "";
                }

                // Diese Funktion fügt beim ausgewählten Steckbrief ein neues Eingabefeld hinzu
                function newInput(button) {
                    const steckbrief = button.closest(".steckbrief");
                    const inputList = steckbrief.querySelector("ol");
                    const newInputField = document.createElement("li");

                    newInputField.innerHTML = `
                        <input type="text" placeholder="Your Input" />
                    `;

                    inputList.appendChild(newInputField);
                }

                // Diese Funktion löscht den ausgewählten Steckbrief
                function deleteItem(button) {
                    button.closest(".item").remove();
                }
    </script>
</body>
</html>
