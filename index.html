        .buttons {
            padding: 10px 20px;

            background-color: hsl(214 100% 74%);

        .menu {

        #productContainer{

        }

            .menu ul {
                display: flex;
                justify-content: center;
                gap: 20px;
                padding: 0;
                margin: 0;
            }

                .menu ul li {
                    list-style: none;
                }

                    .menu ul li a {
                        text-decoration: none;
                        color: #000;
                        font-weight: bold;
                        font-size: 16px;
                        transition: 0.3s;
                    }

                        .menu ul li a:hover {
                            color: #007bff;
                        }

        

        
    </style>
</head>

    </div>
    <label id="countlabel">0</label>
    <div id="Btncontainer">
        <button id="decreaseBtn" onclick="decreaseCount()" class="buttons">decrease</button>
        <button id="resetBtn" onclick="resetCount()" class="buttons">reset</button>
        <button id="increaseBtn" onclick="increaseCount()" class="buttons">increase</button>
    </div>

    <script>
        //Counter
        const decreaseBtn = document.getElementById("decreaseBtn");
        const resetBtn = document.getElementById("resetBtn");
        const increaseBtn = document.getElementById("increaseBtn");
        const countLabel = document.getElementById("countlabel");
        let count = 0;

        function increaseCount() {
            count++;
            countLabel.textContent = count;
        }
        function decreaseCount() {
            count--;
            countLabel.textContent = count;
        }
        function resetCount() {
            count = 0;
            countLabel.textContent = 0;
        }
        

    </script>
